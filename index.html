<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>张月2026生日大屏点位查询</title>
<style>
  :root {
    --primary: #38bdf8;
    --primary-dark: #0284c7;
    --primary-light: #dff3fe;
    --text: #0f2b46;
    --text-light: #5b7a99;
    --border: rgba(148, 213, 243, 0.35);
    --shadow: 0 4px 16px rgba(56, 189, 248, 0.12);
    --shadow-strong: 0 8px 32px rgba(56, 189, 248, 0.2);
    --card-bg: #ffffff;
    --page-bg: linear-gradient(135deg, #f0f9ff 0%, #e6f4fd 100%);
    --footer-text: #0c4a6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Color Emoji", sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #4aa6e0 0%, #69b7ea 45%, #a6d7f5 100%);
    border-radius: 20px;
    padding: 28px 24px;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 8px 26px rgba(58, 145, 200, 0.35);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  header h1 {
    color: #ffffff;
    text-shadow: 0 1px 6px rgba(20, 90, 140, 0.45);
  }

  header::before, header::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    pointer-events: none;
  }
  header::before { width: 210px; height: 210px; top: -90px; right: -70px; }
  header::after { width: 150px; height: 150px; bottom: -55px; left: -45px; }

  /* Cloud / sparkle / bubble pattern */
  .cloud, .sparkle, .bubble {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  .cloud {
    opacity: 0.85;
    animation: cloudDrift 9s ease-in-out infinite alternate;
  }
  .cloud svg { display: block; width: 100%; height: auto; }
  @keyframes cloudDrift {
    0% { transform: translateX(0); }
    100% { transform: translateX(22px); }
  }
  .sparkle {
    animation: sparkleTwinkle 3s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.9) rotate(0); }
    50% { opacity: 1; transform: scale(1.15) rotate(15deg); }
  }
  .bubble {
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.2) 70%);
    animation: cloudDrift 7s ease-in-out infinite alternate;
  }

  .header-inner {
    position: relative;
    z-index: 1;
  }
  /* 把 meta/title 提升到最上层，让 emoji 漂浮在背景 */
  .header-meta, .header-title, .header-subtitle, .hbd-badge {
    position: relative;
    z-index: 2;
  }

  /* HAPPY BIRTHDAY 徽章 (f1) */
  .hbd-badge {
    display: inline-block;
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    color: #ffffff;
    padding: 6px 22px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(244, 138, 182, 0.45);
    margin-bottom: 14px;
    animation: badgeGlow 2.5s ease-in-out infinite;
  }
  @keyframes badgeGlow {
    0%, 100% { box-shadow: 0 4px 14px rgba(244, 138, 182, 0.45); }
    50% { box-shadow: 0 4px 22px rgba(244, 138, 182, 0.7); }
  }

  .header-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    text-align: center;
  }

  .crown {
    display: inline-block;
    width: 52px; height: 52px;
    filter: drop-shadow(0 0 14px rgba(253, 216, 77, 0.95));
    animation: bounce 2s infinite;
  }
  .crown svg { width: 100%; height: 100%; }
  .crown.deco-flower { filter: drop-shadow(0 0 12px rgba(249, 168, 197, 0.85)); }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-6px) rotate(8deg); }
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .header-subtitle {
    font-size: 14px;
    color: #ffffff;
    opacity: 0.92;
    margin-bottom: 18px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    text-align: center;
    padding: 0 8px;
  }

  .heart svg { width: 100%; height: 100%; display: block; }
  .heart-inline {
    display: inline-block;
    width: 24px; height: 22px; vertical-align: middle;
    animation: heartbeat 1.5s infinite;
  }
  .heart-footer {
    display: inline-block;
    width: 18px; height: 16px; vertical-align: middle;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.18); }
    60% { transform: scale(0.95); }
  }

  /* Floating emoji (放在 header-inner 内部但不能遮住内容) */
  .float-emoji {
    position: absolute;
    font-size: 22px;
    animation: emojiFloat 4.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;  /* 不再遮挡 meta/title */
    opacity: 0.7;
    filter: drop-shadow(0 2px 4px rgba(12, 74, 110, 0.18));
  }
  @keyframes emojiFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }

  /* Meta cards */
  .header-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    font-size: 14px;
  }
  .meta-item {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: #0c4a6e;
    box-shadow: 0 4px 14px rgba(255, 255, 255, 0.4);
  }
  .meta-label { opacity: 0.78; font-size: 12px; }
  .meta-value { font-weight: 700; font-size: 17px; }
  .meta-icon { font-size: 14px; }

  /* ===== Filters ===== */
  .filters {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    align-items: end;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .filter-label {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 600;
  }
  .filter-actions {
    display: flex;
    gap: 10px;
    align-items: end;
  }
  .action-btn {
    flex: 1;
    height: 42px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.18s;
  }
  .action-primary {
    background: linear-gradient(135deg, #f9a8c5 0%, #ec6c9a 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(236, 108, 154, 0.35);
  }
  .action-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(236, 108, 154, 0.5); }
  .action-primary:active { transform: scale(0.97); }
  .action-ghost {
    background: transparent;
    color: var(--primary-dark);
    border: 1.5px solid var(--primary);
  }
  .action-ghost:hover { background: var(--primary-light); }

  select, input[type="text"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 40px;
    padding: 0 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    transition: all 0.2s;
    cursor: pointer;
  }
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8 ' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    padding-right: 36px;
  }
  select:hover, select:focus,
  input[type="text"]:hover, input[type="text"]:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(148, 213, 243, 0.15);
  }
  select:disabled, input[type="text"]:disabled {
    background-color: #f5f5f5;
    color: #999;
    cursor: not-allowed;
    opacity: 0.7;
  }

  /* ===== Result info ===== */
  .result-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 12px;
    font-size: 14px;
    color: var(--text-light);
    flex-wrap: wrap;
    gap: 8px;
  }
  .result-count {
    font-weight: 700;
    color: var(--primary-dark);
    font-size: 16px;
  }
  .reset-btn {
    padding: 6px 14px;
    background: transparent;
    color: var(--primary-dark);
    border: 1.5px solid var(--primary);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    background: var(--primary);
    color: #fff;
  }

  /* ===== Cards (mobile) ===== */
  .cards {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    transition: transform 0.2s;
  }
  .card:active { transform: scale(0.98); }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }
  .loc-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 14px;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .screen-count-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 8px;
    background: #fff4e0;
    color: #d97700;
    font-size: 12px;
    font-weight: 600;
    vertical-align: middle;
  }

  .card-row {
    display: flex;
    align-items: start;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    color: var(--text);
  }
  .card-row .label {
    color: var(--text-light);
    font-weight: 600;
    min-width: 76px;
    flex-shrink: 0;
  }
  .card-row .value {
    flex: 1;
    word-break: break-all;
  }

  /* ===== 高德导航按钮 ===== */
  .navi-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: 8px 0 10px;
    padding: 6px 14px;
    background: linear-gradient(135deg, #4aa8e0 0%, #2f8fd0 100%);
    color: #fff !important;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(47, 143, 208, 0.28);
    transition: transform 0.15s, box-shadow 0.15s;
    width: fit-content;
  }
  .navi-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(47, 143, 208, 0.4);
  }
  .navi-btn:active { transform: scale(0.97); }
  .navi-inline {
    display: inline-flex;
    margin: 6px 0 0;
    font-size: 12px;
    padding: 2px 10px;
  }
  .addr-cell { vertical-align: top; }

  /* ===== Table (desktop) ===== */
  .table-wrap {
    display: block;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 1100px;
  }
  thead { background: linear-gradient(135deg, var(--primary-light) 0%, #d8ecfd 100%); }
  th {
    padding: 14px 12px;
    text-align: left;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
    background: linear-gradient(135deg, var(--primary-light) 0%, #d8ecfd 100%);
  }
  td {
    padding: 12px;
    font-size: 13px;
    color: var(--text);
    border-bottom: 1px solid #f0f0f5;
    vertical-align: middle;
  }
  tbody tr { transition: background 0.2s; }
  tbody tr:hover { background: #f0f9ff; }
  tbody tr:last-child td { border-bottom: none; }
  .mall-cell { font-weight: 700; color: var(--text); }
  .pos-tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--primary-light);
    color: var(--primary-dark);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .date-cell { color: var(--primary-dark); font-weight: 600; }
  .location { font-size: 12px; color: var(--text-light); margin-top: 2px; }

  /* ===== Empty ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    grid-column: 1 / -1;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 24px 12px 36px;
    color: var(--footer-text);
    font-size: 13px;
    line-height: 1.9;
  }

  /* Fade in */
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    header { padding: 20px 18px; border-radius: 16px; }
    h1 { font-size: 19px; }
    .hbd-badge { font-size: 11px; padding: 5px 16px; letter-spacing: 1.5px; }
    .crown { width: 40px; height: 40px; }
    .header-meta { grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 12px; }
    .meta-item { padding: 8px 10px; }
    .meta-value { font-size: 15px; }
    .filters { grid-template-columns: repeat(2, 1fr); padding: 14px; }
    .filter-actions { grid-column: 1 / -1; flex-direction: row; }
    .action-btn { flex: 1; }
    .table-wrap { display: none; }
    .cards { display: flex; }
    .card { padding: 14px; }
    .card-title { font-size: 15px; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 17px; }
    .filters { grid-template-columns: 1fr; }
    .float-emoji { font-size: 18px !important; }
  }
</style>
</head>

    <!-- Header -->
    <header>

    </header>

    
    <section class="filters">
      <div class="filter-group">

        <select id="filterProvince"><option value="all">全部省份</option></select>

        return 'https://uri.amap.com/navigation?to=' + r.lng + ',' + r.lat + ',' + name + '&mode=car&src=fanbirthday&callnative=0';
      }
      const city = encodeURIComponent(r.city || '');
      return 'https://uri.amap.com/search?keyword=' + name + (city ? '&city=' + city : '') + '&src=fanbirthday';
    }

    function screenCountTag(count) {
      const n = parseInt(count || 1);
      if (n <= 1) return '';
      return `<span class="screen-count-tag">含 ${n} 屏</span>`;
    }

    function renderCards(data) {
      if (data.length === 0) {
        els.cardsContainer.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🌙</div>
            <div class="empty-text">暂无符合条件的点位</div>
          </div>`;
        return;
      }

      els.cardsContainer.innerHTML = data.map(r => {
        const navi = naviLink(r);
        const addr = escapeHtml(r.address || '—');
        const mall = escapeHtml(r.mall);
        const province = escapeHtml(r.province || '');
        const city = escapeHtml(r.city || '');
        const screenPos = escapeHtml(r.screenPos || '—');
        const screenCount = escapeHtml(r.screenCount || '1');
        const startDate = escapeHtml(r.startDate || '—');
        const startTime = escapeHtml(r.startTime || '—');
        const interval = escapeHtml(r.interval || '—');

        if (THEME_KEY === 'f1') {
          return `<div class="card fade-in">
            <div class="card-head">
              <div class="card-title">${mall}${screenCountTag(r.screenCount)}</div>
              <span class="loc-tag">${province} · ${city}</span>
            </div>
            <div class="card-row">
              <span class="label">详细地址</span>
              <span class="value">${addr}</span>
            </div>
            <a class="navi-btn" href="${navi}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.7 2 6 4.7 6 8c0 5.3 6 14 6 14s6-8.7 6-14c0-3.3-2.7-6-6-6z"/><circle cx="12" cy="8" r="2.2"/></svg>
              高德地图导航
            </a>
            <div class="card-row">
              <span class="label">大屏位置</span>
              <span class="value">${screenPos}</span>
            </div>
            <div class="card-row">
              <span class="label">上屏日期</span>
              <span class="value date-cell">${startDate}</span>
            </div>
            <div class="card-row">
              <span class="label">亮屏时段</span>
              <span class="value">${startTime}</span>
            </div>
            <div class="card-row">
              <span class="label">轮播间隔</span>
              <span class="value">${interval}</span>
            </div>
          </div>`;
        } else {
          return `<div class="card fade-in">
            <div class="card-head">
              <div class="card-title">${mall}</div>
            </div>
            <div class="card-row">
              <span class="label">📍 地址</span>
              <span class="value">${addr}</span>
            </div>
            <a class="navi-btn" href="${navi}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.7 2 6 4.7 6 8c0 5.3 6 14 6 14s6-8.7 6-14c0-3.3-2.7-6-6-6z"/><circle cx="12" cy="8" r="2.2"/></svg>
              高德地图导航
            </a>
            <div class="card-row">
              <span class="label">🖥️ 大屏位置</span>
              <span class="value">${screenPos} × ${screenCount}</span>
            </div>
            <div class="card-row">
              <span class="label">📅 上屏日期</span>
              <span class="value date-cell">${startDate}</span>
            </div>
            <div class="card-row">
              <span class="label">⏰ 亮屏时段</span>
              <span class="value">${startTime}</span>
            </div>
            <div class="card-row">
              <span class="label">🔁 轮播间隔</span>
              <span class="value">${interval}</span>
            </div>
          </div>`;
        }
      }).join('');
    }

    function renderTable(data) {
      if (data.length === 0) {
        els.tableBody.innerHTML = `
          <tr><td colspan="7">
            <div class="empty">
              <div class="empty-icon">🌙</div>
              <div class="empty-text">暂无符合条件的点位</div>
            </div>
          </td></tr>`;
        return;
      }

      els.tableBody.innerHTML = data.map(r => `
        <tr>
          <td class="mall-cell">${escapeHtml(r.mall)}<div class="location">${escapeHtml(r.province || '')} · ${escapeHtml(r.city || '')}</div></td>
          <td class="addr-cell">${escapeHtml(r.address || '—')}<a class="navi-btn navi-inline" href="${naviLink(r)}" target="_blank" rel="noopener">📍 导航</a></td>
          <td><span class="pos-tag">${escapeHtml(r.screenPos || '—')}</span></td>
          <td>${escapeHtml(r.screenCount || '1')}</td>
          <td class="date-cell">${escapeHtml(r.startDate || '—')}</td>
          <td>${escapeHtml(r.startTime || '—')}</td>
          <td>${escapeHtml(r.interval || '—')}</td>
        </tr>
      `).join('');
    }

    function totalScreenCount(data) {
      return data.reduce((sum, r) => sum + (parseInt(r.screenCount) || 1), 0);
    }

    function render() {
      const data = getFiltered();
      els.resultCount.textContent = data.length;
      els.resultScreens.textContent = totalScreenCount(data);
      renderCards(data);
      renderTable(data);
      updateDateOptions();
    }

    els.filterProvince.addEventListener('change', e => {
      state.province = e.target.value;
      updateCityOptions();
      render();
    });

    els.filterCity.addEventListener('change', e => {
      state.city = e.target.value;
      render();
    });

    els.filterKeyword.addEventListener('input', e => {
      state.keyword = e.target.value.trim();
      render();
    });

    if (els.filterDate) {
      els.filterDate.addEventListener('change', e => {
        state.date = e.target.value;
        render();
      });
    }

    function resetAll() {
      state.province = 'all';
      state.city = 'all';
      state.keyword = '';
      state.date = 'all';
      els.filterProvince.value = 'all';
      els.filterKeyword.value = '';
      if (els.filterDate) els.filterDate.value = 'all';
      updateCityOptions();
      render();
    }

    if (els.resetBtn) {
      els.resetBtn.addEventListener('click', resetAll);
    }
    if (els.resetBtnTop) {
      els.resetBtnTop.addEventListener('click', resetAll);
    }
    if (els.searchBtn) {
      els.searchBtn.addEventListener('click', render);
    }

    buildProvinceOptions();
    updateCityOptions();
    render();
  </script>
</body>
</html>
